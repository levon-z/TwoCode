// ============================================================
// HELPERS
// ============================================================

function clamp(
  value,
  min = 0,
  max = 1
) {
  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}


function lerp(
  a,
  b,
  t
) {
  return (
    a +
    (
      b -
      a
    ) *
    t
  );
}


function smooth(
  value
) {
  const t =
    clamp(
      value
    );


  return (
    t *
    t *
    (
      3 -
      2 *
      t
    )
  );
}


function range(
  value,
  start,
  end
) {
  return smooth(
    clamp(
      (
        value -
        start
      ) /
      (
        end -
        start
      )
    )
  );
}


function inside(
  x,
  y,
  bounds
) {
  if (!bounds) {
    return false;
  }


  return (
    x >=
      bounds.x &&
    x <=
      bounds.x +
      bounds.width &&
    y >=
      bounds.y &&
    y <=
      bounds.y +
      bounds.height
  );
}


function bodyScale(
  diameter
) {
  return (
    diameter /
    82
  );

    innerHeight +
    'px';


  ctx.setTransform(
    dpr,
    0,
    0,

// ============================================================
// AUDIO
// ============================================================

let audioContext =
  null;


function getAudio() {
  if (
    !soundEnabled
  ) {
    return null;
  }


  if (
    !audioContext
  ) {
    audioContext =
      new AudioContext();
  }


  return audioContext;
}


function tone(
  from,
  to,
  duration,
  volume = 0.018,
  delay = 0
) {
  const audio =
    getAudio();


  if (!audio) {
    return;
  }


  try {
    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    const start =
      audio.currentTime +
      delay;


    oscillator.type =
      'sine';


    oscillator.frequency
      .setValueAtTime(
        from,
        start
      );


    oscillator.frequency
      .exponentialRampToValueAtTime(
        Math.max(
          20,
          to
        ),
        start +
        duration
      );


    gain.gain
      .setValueAtTime(
        0.0001,
        start
      );


    gain.gain
      .linearRampToValueAtTime(
        volume,
        start +
        0.01
      );


    gain.gain
      .exponentialRampToValueAtTime(
        0.0001,
        start +
        duration
      );


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.start(
      start
    );


    oscillator.stop(
      start +
      duration +
      0.02
    );

  } catch {}
}

}


// ============================================================
// TRANSITIONS
// ============================================================

function targetHeight() {
  if (
    currentView ===
    'home'
  ) {
    return UI.HOME_H;
  }


  if (
    currentView ===
    'spotify'
  ) {
    return UI.SPOTIFY_H;
  }


  if (
    currentView ===
    'apps'
  ) {
    return UI.APPS_H;
  }


  if (
    currentView ===
    'settings'
  ) {
    return UI.SETTINGS_H;
  }


  if (
    currentView ===
    'project'
  ) {
    return UI.PROJECT_H;
  }


  return UI.PROMPT_H;
}


function modeTarget(
  targetMode
) {
  if (
    targetMode ===
    'rest'
  ) {
    return {
      width:
        UI.REST_W,

      height:
        UI.BAR_H,

      radius:
        UI.COMPACT_RADIUS
    };
  }


  if (
    targetMode ===
    'compact'
  ) {
    return {
      width:
        UI.COMPACT_W,

      height:
        UI.COMPACT_H,

      radius:
        UI.COMPACT_H / 2
    };
  }


  return {
    width:
      UI.EXPANDED_W,

    height:
      targetHeight(),

    radius:
      UI.EXPANDED_RADIUS
  };
}


function setMode(
  next,
  playSound = true
) {
  const target =
    modeTarget(
      next
    );


  const same =
    mode ===
      next &&
    Math.abs(
      visual.width -
      target.width
    ) <
      1 &&
    Math.abs(
      visual.height -
      target.height
    ) <
      1;


  if (
    same &&
    !transition
  ) {
    return;
  }


  const growing =
    target.width *
    target.height >
    visual.width *
    visual.height;


  transition = {
    from: {
      ...visual
    },

    to:
      target,

    started:
      performance.now(),

    // Opening and closing use the same speed and the same motion.
    duration:
      380,

    growing
  };


  mode =
    next;


  if (
    playSound
  ) {
    sound(
      growing
        ?
          'open'
        :
          'close'
    );
  }
}


// The island's size moves like a spring (Apple: start from the current on-screen value, keep the velocity when the
// target changes, settle without wobbling; a hint of overshoot only when it grows). Velocities live outside the
// transition, so grabbing it mid-way (opening while it closes) carries on smoothly instead of jumping.
const islandSpring = { width: 0, height: 0, radius: 0, last: 0 };
function updateTransition(
  now
) {
  // the spring keeps its own clock: a new target (setMode called again) never restarts it, it just steers it
  const dt = islandSpring.last ? Math.min( 1 / 20, Math.max( 0, ( now - islandSpring.last ) / 1000 ) ) : 1 / 60;
  islandSpring.last = now;
  if ( !transition ) return;
  const speed = ( transition.duration || 380 ) / 380; // Settings → speed scales the spring's response
  const response = ( transition.growing ? 0.42 : 0.34 ) * speed, damping = transition.growing ? 0.86 : 1;
  const stiffness = Math.pow( 2 * Math.PI / response, 2 ), friction = 4 * Math.PI * damping / response;
  let settled = true;
  const steps = Math.max( 1, Math.ceil( dt / ( 1 / 240 ) ) ), h = dt / steps;
  for ( const key of [ 'width', 'height', 'radius' ] ) {
    let x = visual[ key ], v = islandSpring[ key ];
    const target = transition.to[ key ];
    for ( let i = 0; i < steps; i++ ) {
      v += ( -stiffness * ( x - target ) - friction * v ) * h;
      x += v * h;
    }
    visual[ key ] = x; islandSpring[ key ] = v;
    if ( Math.abs( x - target ) > 0.3 || Math.abs( v ) > 3 ) settled = false;
  }
  if ( settled ) {
    visual = { ...transition.to };
    islandSpring.width = islandSpring.height = islandSpring.radius = 0;
    transition = null;
  }
}


// ============================================================
// DRAW HELPERS
// ============================================================

function islandPath(
  x,
  y,
  width,
  height,
  radius
) {
  // It hangs from the top edge of the screen like the notch on a MacBook: at the top it flows out of the edge with
  // two small inward curves ("ears"), at the bottom it has round corners.
  const r = Math.max( 0, Math.min( radius, width / 2, height ) );
  const ear = Math.max( 0, Math.min( 10, height / 3, width / 8 ) );
  ctx.beginPath();
  ctx.moveTo( x - ear, y );
  ctx.lineTo( x + width + ear, y );
  ctx.quadraticCurveTo( x + width, y, x + width, y + ear );
  ctx.lineTo( x + width, y + height - r );
  ctx.arcTo( x + width, y + height, x + width - r, y + height, r );
  ctx.lineTo( x + r, y + height );
  ctx.arcTo( x, y + height, x, y + height - r, r );
  ctx.lineTo( x, y + ear );
  ctx.quadraticCurveTo( x, y, x - ear, y );
  ctx.closePath();
}


function box(
  x,
  y,
  width,
  height,
  radius,
  fill
) {
  width = Math.max(0, width || 0); height = Math.max(0, height || 0);
  radius = Math.max(0, Math.min(radius || 0, width / 2, height / 2)); // never negative
  ctx.beginPath();


  ctx.roundRect(
    x,
    y,
    width,
    height,
    Math.min(
      radius,
      width /
      2,
      height /
      2
    )
  );


  ctx.fillStyle =
    fill;


  ctx.fill();
}


function text(
  value,
  x,
  y,
  size = 12,
  color = '#fff',
  weight = 400,
  align = 'left',
  maxWidth = null
) {
  // Windows 11 font for a sharp, modern look.
  ctx.font =
    `${weight} ${size}px Inter, "Segoe UI", sans-serif`;


  ctx.fillStyle =
    color;


  ctx.textAlign =
    align;


  ctx.textBaseline =
    'alphabetic';


  let content =
    String(
      value ||
      ''
    );


  if (
    maxWidth &&
    align ===
    'left'
  ) {
    while (
      content.length >
        1 &&
      ctx.measureText(
        content
      ).width >
        maxWidth
    ) {
      content =
        content.slice(
          0,
          -2
        ) +
        '…';
    }
  }


  ctx.fillText(
    content,
    x,
    y
  );
}


function codeText(
  value,
  x,
  y,
  size = 9,
  color = '#d5ddd2',
  maxWidth = null
) {
  ctx.font =
    `${size}px Consolas, monospace`;


  ctx.fillStyle =
    color;


  ctx.textAlign =
    'left';


  ctx.textBaseline =
    'alphabetic';


  let content =
    String(
      value ??
      ''
    )
      .replace(
        /\t/g,
        '  '
      );


  if (
    maxWidth
  ) {
    while (
      content.length >
        1 &&
      ctx.measureText(
        content
      ).width >
        maxWidth
    ) {
      content =
        content.slice(
          0,
          -2
        ) +
        '…';
    }
  }


  ctx.fillText(
    content,
    x,
    y
  );
}


// ============================================================

// ============================================================

function drawSpeakerIcon(
  x,
  y,
  muted = false
) {
  ctx.save();


  ctx.strokeStyle =
    '#d8e2d4';


  ctx.fillStyle =
    '#d8e2d4';


  ctx.lineWidth =
    1.5;


  ctx.lineCap =
    'round';


  ctx.lineJoin =
    'round';


  ctx.beginPath();


  ctx.moveTo(
    x -
    8,
    y -
    3
  );


  ctx.lineTo(
    x -
    4,
    y -
    3
  );


  ctx.lineTo(
    x +
    1,
    y -
    7
  );


  ctx.lineTo(
    x +
    1,
    y +
    7
  );


  ctx.lineTo(
    x -
    4,
    y +
    3
  );


  ctx.lineTo(
    x -
    8,
    y +
    3
  );


  ctx.closePath();


  ctx.fill();


  if (
    muted
  ) {
    ctx.beginPath();


    ctx.moveTo(
      x +
      5,
      y -
      5
    );


    ctx.lineTo(
      x +
      11,
      y +
      5
    );


    ctx.moveTo(
      x +
      11,
      y -
      5
    );


    ctx.lineTo(
      x +
      5,
      y +
      5
    );


    ctx.stroke();

  } else {
    ctx.beginPath();


    ctx.arc(
      x +
      1,
      y,
      5,
      -0.75,
      0.75
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(
      x +
      1,
      y,
      9,
      -0.72,
      0.72
    );


    ctx.stroke();
  }


  ctx.restore();
}


// ============================================================
// GHOST
// ============================================================

function drawGhost(
  x,
  y,
  diameter
) {
  // Robo is out of the island (buddy-ui.js): there is only one Robo
  if (window.__twocodeCarried?.() && !window.__twocodeBuddyDrawing) return;

  const scale =
    bodyScale(
      diameter
    );


  /*
    Kleur van het lijfje: te kiezen in
    Instellingen (twocode-fun.js).
  */

  const look =
    window.__twocodeLook?.() ||
    {};


  const shell1 =
    angry >
      0.05
      ?
        '#795151'
      :
        look.shell1 ||
        '#59695d';


  const shell2 =
    angry >
      0.05
      ?
        '#462929'
      :
        look.shell2 ||
        '#344239';


  /*
    De ogen zijn het stoplicht (ai-monitor-ui.js):
    oranje knippert = bezig, oranje = vraag,
    groen = klaar, rood = fout.
  */

  const status =
    window.__twocodeEyes?.();


  const eye =
    angry >
      0.05
      ?
        '#ff6b6b'
      :
        status?.color ||
        look.eye ||
        '#e3ffd4';


  const eyeAlpha =
    status?.blink
      ?
        0.3 +
        0.7 *
        (
          0.5 +
          0.5 *
          Math.cos(
            performance.now() /
            200
          )
        )
      :
        1;


  ctx.save();


  ctx.translate(
    x,
    y
  );


  ctx.rotate(
    Math.sin(
      performance.now() *
      0.006
    ) *
    0.08 *
    dizzy
  );


  ctx.scale(
    scale,
    scale
  );


  /*
    twocode-fun.js: springen, dansen,
    gezichtjes en outfits.
  */

  const fx =
    window.__twocodeGhostFx?.() ||
    {};


  ctx.translate(
    0,
    fx.dy || 0
  );


  // sx / sy: squash and stretch (wider + lower, or thinner + taller), like a jelly blob.
  ctx.scale(
    (fx.scale ?? 1) * (fx.sx ?? 1), // ?? not ||: a scale of 0 must really make him invisible
    (fx.scale ?? 1) * (fx.sy ?? 1)
  );


  ctx.rotate(
    fx.tilt || 0
  );


  // "Wolk" look: a bright white, soft rounded blob with dark eyes (the eyes take the traffic-light colour),
  // and a small status dot. Pops on the black island.
  if (look.style === 'blob') {
    drawBlob(look, status, eye, eyeAlpha, fx);
    window.__twocodeGhostDecor?.(ctx);
    ctx.restore();
    return;
  }


  ctx.beginPath();


  ctx.moveTo(
    -8,
    -28
  );


  ctx.quadraticCurveTo(
    0,
    -42,
    8,
    -28
  );


  ctx.lineTo(
    13,
    -13
  );


  ctx.fillStyle =
    shell2;


  ctx.fill();


  const gradient =
    ctx.createRadialGradient(
      -13,
      -10,
      3,
      0,
      0,
      43
    );


  gradient.addColorStop(
    0,
    shell1
  );


  gradient.addColorStop(
    1,
    '#101511'
  );


  ctx.beginPath();


  ctx.ellipse(
    0,
    0,
    41,
    32,
    0,
    0,
    Math.PI *
    2
  );


  ctx.fillStyle =
    gradient;


  ctx.fill();


  ctx.beginPath();


  ctx.ellipse(
    0,
    3,
    28,
    22,
    0,
    0,
    Math.PI *
    2
  );


  ctx.fillStyle =
    '#030504';


  ctx.fill();


  for (
    const side of [
      -1,
      1
    ]
  ) {
    ctx.save();


    ctx.translate(
      side *
      15 +
      ghostLookX,

      3 +
      ghostLookY
    );


    ctx.globalAlpha *=
      eyeAlpha;


    ctx.shadowColor =
      eye;


    ctx.shadowBlur =
      status
        ? 14
        : 9;


    drawEye(
      side,
      eye,
      angry > 0.05
        ? null
        : fx.mood
    );


    ctx.restore();
  }


  window.__twocodeGhostDecor?.(
    ctx
  );


  ctx.restore();
}


// "Robo" look (TwoCode's own character, not anyone else's): a small white robot with a dark visor screen
// where his glowing eyes live, and an antenna on top whose little ball is the status light
// (orange = Claude busy, your colour = done, red = error).
function drawBlob(look, status, eye, eyeAlpha, fx) {
  const tint = angry > 0.05 ? '#ffd9d9' : look.shell2 || '#e2ece6';
  // shadow under him
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 32, 30, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // antenna: a thin stem with the status ball
  const bulb = status?.color || '#f2f6f3', bulbAlpha = status?.blink ? 0.55 + 0.45 * Math.cos(performance.now() / 200) : 1;
  ctx.save(); ctx.strokeStyle = tint; ctx.lineWidth = 3; ctx.lineCap = 'round';
  const wearing = !!window.__twocodeOutfitOn?.(), top = wearing ? -56 : -40; // taller antenna when he wears a hat, so the light stays visible
  ctx.beginPath(); ctx.moveTo(0, -27); ctx.quadraticCurveTo(2, (top - 27) / 2 - 2, 0, top); ctx.stroke();
  ctx.globalAlpha = bulbAlpha; ctx.beginPath(); ctx.arc(0, top - 3, 5, 0, Math.PI * 2); ctx.fillStyle = bulb;
  if (status?.color) { ctx.shadowColor = bulb; ctx.shadowBlur = 14; } ctx.fill(); ctx.restore();
  // body: a round, friendly shell
  const body = ctx.createLinearGradient(0, -28, 0, 30);
  body.addColorStop(0, look.shell1 || '#ffffff'); body.addColorStop(1, tint);
  ctx.save(); ctx.shadowColor = status?.color || 'rgba(255,255,255,.3)'; ctx.shadowBlur = status?.color ? 14 : 10;
  ctx.beginPath(); ctx.ellipse(0, 2, 37, 30, 0, 0, Math.PI * 2); ctx.fillStyle = body; ctx.fill(); ctx.restore();
  // little ears (side bolts)
  ctx.save(); ctx.fillStyle = tint;
  for (const side of [-1, 1]) { ctx.beginPath(); ctx.roundRect(side * 37 - 4, -4, 8, 14, 4); ctx.fill(); }
  ctx.restore();
  // visor screen
  const visor = ctx.createLinearGradient(0, -16, 0, 18);
  visor.addColorStop(0, '#20242a'); visor.addColorStop(1, '#0b0d10');
  ctx.save(); ctx.beginPath(); ctx.roundRect(-27, -14, 54, 32, 14); ctx.fillStyle = visor; ctx.fill();
  ctx.globalAlpha = 0.18; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(-22, -11, 26, 4, 2); ctx.fill(); ctx.restore();
  // glowing eyes on the visor
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(side * 12 + ghostLookX * 0.8, 2 + ghostLookY * 0.8); ctx.scale(0.82, 0.82);
    ctx.globalAlpha *= eyeAlpha; ctx.shadowColor = eye; ctx.shadowBlur = status ? 14 : 9;
    drawEye(side, eye, angry > 0.05 ? null : fx.mood);
    ctx.restore();
  }
}

/* The island is Robo's face: in the small island only his two eyes, with all his moods and his traffic-light colours.
   They look a little towards the mouse. Dragging them still pulls Robo himself out of the island (buddy-ui.js). */
function drawIslandEyes( cx, cy, size = 1 ) {
  if ( window.__twocodeCarried?.() && !window.__twocodeBuddyDrawing ) return; // he is out on the screen
  const fx = window.__twocodeGhostFx?.() || {}, status = window.__twocodeEyes?.(), look = window.__twocodeLook?.() || {};
  const eye = angry > 0.05 ? '#ff6b6b' : status?.color || look.eye || '#e3ffd4';
  const alpha = status?.blink ? 0.3 + 0.7 * ( 0.5 + 0.5 * Math.cos( performance.now() / 200 ) ) : 1;
  const lookX = pointer.known ? Math.max( -1, Math.min( 1, ( pointer.x - cx ) / 320 ) ) * 2.2 * size : 0;
  const lookY = pointer.known ? Math.max( -1, Math.min( 1, ( pointer.y - cy ) / 200 ) ) * 0.8 * size : 0;
  const scale = fx.scale ?? 1, hop = ( fx.dy || 0 ) * 0.18 * size;
  ctx.save();
  ctx.translate( cx + lookX, cy + lookY + hop );
  ctx.rotate( Math.sin( performance.now() * 0.006 ) * 0.08 * dizzy + ( fx.tilt || 0 ) * 0.5 );
  ctx.scale( scale * ( fx.sx ?? 1 ), scale * ( fx.sy ?? 1 ) );
  for ( const side of [ -1, 1 ] ) {
    ctx.save();
    ctx.translate( side * 8.5 * size, 0 );
    ctx.scale( 0.62 * size, 0.62 * size );
    ctx.globalAlpha *= alpha;
    ctx.shadowColor = eye;
    ctx.shadowBlur = 10;
    drawEye( side, eye, angry > 0.05 ? null : fx.mood );
    ctx.restore();
  }
  ctx.restore();
}
window.__twocodeIslandEyes = drawIslandEyes;

/*
  Gezichtjes:
  focus = turen, curious = grote ogen,
  happy = ^ ^, sad = hangende ogen,
  sleep = dichte ogen.
*/

function drawEye(
  side,
  eye,
  mood
) {
  ctx.fillStyle =
    eye;


  ctx.strokeStyle =
    eye;


  ctx.lineWidth =
    3;


  ctx.lineCap =
    'round';


  ctx.beginPath();


  if (
    mood ===
    'happy'
  ) {
    ctx.arc(
      0,
      3,
      5,
      Math.PI * 1.15,
      Math.PI * 1.85
    );


    ctx.stroke();


    return;
  }


  if (
    mood ===
    'heart'
  ) {
    ctx.moveTo(
      0,
      6
    );


    ctx.bezierCurveTo(
      -9, -1,
      -5, -9,
      0, -4
    );


    ctx.bezierCurveTo(
      5, -9,
      9, -1,
      0, 6
    );


    ctx.fillStyle =
      '#ff5c8a';


    ctx.fill();


    return;
  }


  if (
    mood ===
    'dizzy'
  ) {
    // Spinning spiral eyes
    const turn =
      performance.now() /
      140 *
      side;


    for (
      let a = 0;
      a < Math.PI * 4;
      a += 0.3
    ) {
      const r =
        a *
        0.55;


      ctx.lineTo(
        Math.cos(a + turn) * r,
        Math.sin(a + turn) * r
      );
    }


    ctx.lineWidth =
      2.2;


    ctx.stroke();


    return;
  }


  if (
    mood ===
      'wink' &&
    side ===
      1
  ) {
    ctx.moveTo(
      -5,
      2
    );


    ctx.lineTo(
      5,
      2
    );


    ctx.stroke();


    return;
  }


  if (
    mood ===
      'sleep' ||
    mood ===
      'blink'
  ) {
    ctx.arc(
      0,
      -2,
      5,
      Math.PI * 0.15,
      Math.PI * 0.85
    );


    ctx.stroke();


    return;
  }


  if (
    mood ===
    'focus'
  ) {
    ctx.ellipse(
      0,
      1,
      5.5,
      4,
      0,
      0,
      Math.PI * 2
    );
  } else if (
    mood ===
    'sad'
  ) {
    ctx.ellipse(
      0,
      2,
      4.5,
      6.5,
      side * -0.45,
      0,
      Math.PI * 2
    );
  } else if (
    mood ===
    'surprised'
  ) {
    ctx.arc(
      0,
      0,
      7,
      0,
      Math.PI * 2
    );
  } else if (
    mood ===
    'curious'
  ) {
    ctx.ellipse(
      0,
      0,
      6,
      9.5,
      0,
      0,
      Math.PI * 2
    );
  } else {
    ctx.ellipse(
      0,
      0,
      5,
      8,
      0,
      0,
      Math.PI * 2
    );
  }


  ctx.fill();
}


// ============================================================
// ISLAND
// ============================================================

function drawIsland() {
  const centerX =
    innerWidth /
    2;
  const x =
    centerX -
    visual.width /
    2;
  islandBounds = {
    x,
    y:
      0,
    width:
      visual.width,
    height:
      visual.height
  };
  // Opaque black, like the Dynamic Island (Apple: no custom backgrounds in the island). A soft shadow lifts it off a
  // light desktop; while something is going on, a thin key line in its colour runs round the edge.
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.28)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 3;
  islandPath( x, 0, visual.width, visual.height, visual.radius );
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();
  islandPath( x, 0, visual.width, visual.height, visual.radius );
  ctx.fillStyle = '#000';
  ctx.fill();
  window.__twocodeIslandBackdrop?.( x, visual.width, visual.height, visual.radius ); // a page may colour the whole island
  const line = window.__twocodeEyes?.()?.color;
  if ( line ) { // (not along the top: there it flows into the screen edge)
    ctx.save();
    ctx.beginPath(); ctx.rect( 0, 3, innerWidth, innerHeight ); ctx.clip();
    islandPath( x + 0.5, 0, visual.width - 1, visual.height - 0.5, visual.radius );
    ctx.strokeStyle = 'rgba(255,255,255,.1)'; // a faint neutral edge, so the black island stays visible on a dark desktop
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
}

// ============================================================
// PROJECT LOAD
// ============================================================

async function loadProject() {
  projectLoading =
    true;


  projectError =
    '';


  try {
    const result =
      await window.twocode
        .projectGet();


    projectState =
      result ||
      {
        ok:
          false,

        selected:
          false
      };


    if (
      !projectState.ok
    ) {
      projectError =
        projectState.error ||
        'Project kon niet geladen worden.';
    }

  } catch {
    projectError =
      'Project kon niet geladen worden.';
  }


  projectLoading =
    false;
}


async function chooseProject() {
  projectLoading =
    true;


  projectError =
    '';


  projectSearchResults =
    [];


  projectReadData =
    null;


  try {
    const result =
      await window.twocode
        .projectChoose();


    if (
      result?.cancelled
    ) {
      projectLoading =
        false;

      return;
    }


    projectState =
      result;


    if (
      !result?.ok
    ) {
      projectError =
        result?.error ||
        'Project kon niet geopend worden.';
    }

  } catch {
    projectError =
      'Project kon niet geopend worden.';
  }


  projectLoading =
    false;
}


async function rescanProject() {
  projectLoading =
    true;


  projectError =
    '';


  try {
    const result =
      await window.twocode
        .projectRescan();


    projectState =
      result;


    if (
      !result?.ok
    ) {
      projectError =
        result?.error ||
        'Project kon niet opnieuw gescand worden.';
    }

  } catch {
    projectError =
      'Project kon niet opnieuw gescand worden.';
  }


  projectLoading =
    false;
}


// ============================================================
// PROJECT SEARCH
// ============================================================

async function performProjectSearch() {
  const query =
    projectInput.value
      .trim();


  if (
    !query
  ) {
    projectSearchError =
      'Typ eerst wat je wilt zoeken.';

    return;
  }


  projectSearchLoading =
    true;


  projectSearchError =
    '';


  projectSearchResults =
    [];


  projectReadData =
    null;


  projectSelectedResult =
    null;


  try {
    const result =
      await window.twocode
        .projectSearch(
          query
        );


    if (
      !result?.ok
    ) {
      projectSearchError =
        result?.error ||
        'Zoeken mislukt.';

    } else {
      projectSearchResults =
        result.results ||
        [];


      projectSearchMeta =
        result;


      if (
        projectSearchResults.length ===
        0
      ) {
        projectSearchError =
          'Ik vond hier nog geen relevante code voor.';
      }
    }

  } catch {
    projectSearchError =
      'Zoeken in het project is mislukt.';
  }


  projectSearchLoading =
    false;
}


// ============================================================
// PROJECT READ
// ============================================================

async function openProjectResult(
  result
) {
  if (
    !result
  ) {
    return;
  }


  projectInput.blur();


  projectReadLoading =
    true;


  projectReadData =
    null;


  projectSelectedResult =
    result;


  const line =
    result.matches?.[0]
      ?.line ||
    1;


  try {
    const read =
      await window.twocode
        .projectRead(
          result.file,
          line
        );


    if (
      !read?.ok
    ) {
      projectSearchError =
        read?.error ||
        'Bestand kon niet gelezen worden.';

    } else {
      projectReadData =
        read;
    }

  } catch {
    projectSearchError =
      'Bestand kon niet gelezen worden.';
  }


  projectReadLoading =
    false;
}

function setAlbum(
  url
) {
  if (
    url ===
    albumUrl
  ) {
    return;
  }


  albumUrl =
    url;


  if (!url) {
    albumImage =
      null;

    return;
  }


  const image =
    new Image();


  image.onload =
    () => {
      albumImage =
        image;
    };


  image.src =
    url;
}


async function refreshSpotify() {
  if (window.__twocodeLicense?.().locked.includes('spotify')) return; // the Music pack (license-main.cjs)
  try {
    const result =
      await window.twocode
        .spotifyGetState();


    if (!result) {
      return;
    }


    spotifyConnected =
      Boolean(
        result.connected
      );


    if (
      result.connected
    ) {
      spotifyState = {
        active:
          Boolean(
            result.active
          ),

        is_playing:
          Boolean(
            result.is_playing
          ),

        progress_ms:
          Number(
            result.progress_ms ||
            0
          ),

        duration_ms:
          Number(
            result.duration_ms ||
            0
          ),

        track:
          result.track ||
          null,

        // where it plays (this PC, your phone, the car…)
        device:
          result.device ||
          null,

        error:
          result.error || '',

        status:
          Number(result.status || 0),

        detail:
          result.detail || ''
      };


      spotifySyncAt =
        performance.now();


      setAlbum(
        result.track
          ?.image_url ||
        ''
      );
    }

  } catch {}
}

// ============================================================
// INTRO
// ============================================================

let introStarted =
  performance.now();


let introFinished =
  false;
window.__twocodeReplayIntro = () => { introStarted = performance.now(); introFinished = false; }; // videos and tests: play the startup again


function drawIntro(
  now
) {
  // Startup, calm like the Dynamic Island: a dot comes out of the top edge and springs open into the small pill,
  // then Robo opens his eyes (they grow from a line, like opening). Nothing pops in at once.
  const centerX = innerWidth / 2;
  const progress = clamp( ( now - introStarted ) / 1300 );
  const grow = clamp( progress / 0.5 ), back = 1.6;
  const springy = grow <= 0 ? 0 : 1 + ( back + 1 ) * Math.pow( grow - 1, 3 ) + back * Math.pow( grow - 1, 2 ); // ease-out with a small overshoot
  visual.width = lerp( 18, UI.REST_W, springy );
  visual.height = lerp( 4, UI.BAR_H, Math.min( 1, grow * 1.4 ) );
  visual.radius = Math.min( UI.COMPACT_RADIUS, visual.height / 2 );
  if ( progress > 0.02 ) drawIsland();
  const open = clamp( ( progress - 0.45 ) / 0.3 ), lid = open <= 0 ? 0 : 1 - Math.pow( 1 - open, 3 );
  if ( lid > 0 ) {
    ctx.save(); ctx.globalAlpha = Math.min( 1, lid * 1.5 );
    ctx.translate( centerX, visual.height / 2 ); ctx.scale( 1, Math.max( 0.08, lid ) ); ctx.translate( -centerX, -visual.height / 2 );
    window.__twocodeIslandEyes ? window.__twocodeIslandEyes( centerX, visual.height / 2 ) : drawGhost( centerX, 12, 16 );
    ctx.restore();
  }


  if (
    progress >=
      1 &&
    !introFinished
  ) {
    introFinished =
      true;


    mode =
      'rest';


    visual = {
      width:
        UI.REST_W,

      height:
        UI.BAR_H,

      radius:
        UI.COMPACT_RADIUS
    };


    sound(
      'intro'
    );
  }
}

// ============================================================
// HOVER
// ============================================================

function updateHover(
  now
) {
  if (
    !introFinished
  ) {
    return;
  }


  if (
    currentView ===
      'project' &&
    mode !==
      'expanded'
  ) {
    return;
  }


  // the island floats a few px below the screen edge: the mouse at the very top still counts (easy to hit)
  const over =
    pointer.known &&
    (
      inside( pointer.x, pointer.y, islandBounds ) ||
      ( pointer.y < 0 && pointer.y > -14 && pointer.x >= islandBounds.x && pointer.x <= islandBounds.x + islandBounds.width )
    );


  if (
    mode ===
    'rest'
  ) {
    if (
      over
    ) {
      hoverStartedAt =
        now;


      // Silent: the "open" sound plays once, when it really opens.
      setMode(
        'compact',
        false
      );
    }


    return;
  }


  if (
    mode ===
    'compact'
  ) {
    if (
      over
    ) {
      if (
        hoverStartedAt ===
        null
      ) {
        hoverStartedAt =
          now;
      }


      if (
        now -
        hoverStartedAt >
        UI.NORMAL_PEEK_DELAY
      ) {
        setMode(
          'expanded'
        );


        hoverStartedAt =
          null;
      }

    } else {
      setMode(
        'rest'
      );
    }


    return;
  }


  if (
    mode ===
    'expanded'
  ) {
    /*
      Elk scherm klapt in als je er niet mee bezig bent.
      Niet terwijl je typt: dan blijft hij open.
    */

    if (
      !over &&
      !isTyping()
    ) {
      if (
        leaveStartedAt ===
        null
      ) {
        leaveStartedAt =
          now;
      }


      const delay =
        currentView ===
          'home'
          ? UI.HOME_LEAVE_DELAY
          : UI.VIEW_LEAVE_DELAY;


      if (
        now -
        leaveStartedAt >
        delay
      ) {
        collapseIdle();


        leaveStartedAt =
          null;
      }

    } else {
      leaveStartedAt =
        null;
    }
  }
}


function isTyping() {
  const element =
    document.activeElement;


  return (
    document.hasFocus() &&
    Boolean(
      element &&
      (
        element.tagName === 'INPUT' ||
        element.tagName === 'TEXTAREA' ||
        element.isContentEditable
      )
    )
  );
}


function collapseIdle() {
  /*
    Zelfde als Escape: terug naar home en klein.
    island-window-ui.js zet het scherm terug
    als je de island weer aanklikt.
  */

  if (
    currentView !==
    'home'
  ) {
    projectInput.blur();


    projectInput.style.display =
      'none';


    currentView =
      'home';
  }


  setMode(
    'rest'
  );
}


// ============================================================
// CHARACTER
// ============================================================

function updateCharacter(
  dt
) {
  let ghostX =
    innerWidth /
    2;


  let ghostY =
    12;


  if (
    mode ===
    'expanded'
  ) {
    const content =
      contentRect();


    ghostX =
      content.x +
      45;


    ghostY =
      content.y +
      content.height /
      2;
  }


  const targetX =
    pointer.known
      ?
        Math.tanh(
          (
            pointer.x -
            ghostX
          ) /
          260
        ) *
        4
      :
        0;


  const targetY =
    pointer.known
      ?
        Math.tanh(
          (
            pointer.y -
            ghostY
          ) /
          200
        ) *
        2.8
      :
        0;


  ghostLookX +=
    (
      targetX -
      ghostLookX
    ) *
    (
      1 -
      Math.exp(
        -10 *
        dt
      )
    );


  ghostLookY +=
    (
      targetY -
      ghostLookY
    ) *
    (
      1 -
      Math.exp(
        -10 *
        dt
      )
    );
}

// ============================================================
// INTERACTIVE
// ============================================================

// Whether the window catches clicks (on the island) or lets them through to the apps below (Chrome, ...).
// Everything goes through here. Once a second the state is sent again anyway, so it can never get stuck
// (it used to stay "catching clicks" after Claude finished, until you hovered TwoCode).
let interactiveSentAt = 0;

function sendInteractive(
  next
) {
  // while Robo is carried the island keeps the mouse, so letting go anywhere on screen reaches us
  if (window.__twocodeDragging?.()) next = true;
  if (
    next ===
    interactiveSent &&
    performance.now() - interactiveSentAt < 1000
  ) {
    return;
  }


  interactiveSent =
    next;

  interactiveSentAt =
    performance.now();


  window.twocode
    .setIslandInteractive(
      next
    );
}


// "Typing" only counts while a visible text field really has focus and TwoCode's window is active.
// (A text field that was removed or hidden while focused used to keep this on forever.)
function typingNow() {
  const el =
    document.activeElement;

  return Boolean(
    projectInputFocused &&
    document.hasFocus() &&
    el &&
    /^(INPUT|TEXTAREA)$/.test(el.tagName) &&
    el.offsetParent !== null
  );
}


// ============================================================
// RENDER
// ============================================================

let lastFrame =
  performance.now();


function drawIslandFrame(
  now
) {
  const dt =
    Math.min(
      (
        now -
        lastFrame
      ) /
      1000,
      0.04
    );


  lastFrame =
    now;


  ctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );


  hit = {};


  projectInputBounds =
    null;


  if (
    !introFinished
  ) {
    drawIntro(
      now
    );


    projectInput.style.display =
      'none';


    sendInteractive(
      false
    );


    


    return;
  }


  updateTransition(
    now
  );


  drawIsland();


  updateHover(
    now
  );


  updateCharacter(
    dt
  );


  ctx.save();


  islandPath(
    islandBounds.x,
    0,
    islandBounds.width,
    islandBounds.height,
    visual.radius
  );


  ctx.clip();


  const alpha = range( visual.width, 360, UI.EXPANDED_W - 12 ); // fully visible once the island is (nearly) open


  // Small content in the small/medium island (it can be wide, e.g. with answer buttons), big content when open.
  if (
    mode !== 'expanded' ||
    visual.width <
    380
  ) {
    // while it shrinks, the small content only fades in once the island is nearly its small size (like the iPhone)
    const smallFade = mode === 'expanded' ? 1 : Math.max( 0, Math.min( 1, 1 - ( visual.height - modeTarget( mode ).height ) / 24 ) );
    if ( smallFade > 0.01 ) {
      ctx.globalAlpha = smallFade;
      drawSmall();
      ctx.globalAlpha = 1;
    }
  } else {
    drawExpanded(
      alpha
    );
  }


  ctx.restore();


  updateProjectInput();


  const overIsland =
    pointer.known &&
    inside(
      pointer.x,
      pointer.y,
      islandBounds
    );


  const overHit =
    pointer.known &&
    Object.values(
      hit
    ).some(
      bounds =>
        inside(
          pointer.x,
          pointer.y,
          bounds
        )
    );


  // Catch the mouse only while it is really on the island. Typing does not need it (keyboard focus
  // stays anyway), and catching the mouse while typing made the invisible window (860×320, over the
  // browser's tabs and address bar) eat clicks meant for Chrome until you clicked TwoCode again.
  sendInteractive(
    overIsland ||
    overHit
  );


  const cursorNow = overHit ? 'pointer' : 'default';

  if (canvas.style.cursor !== cursorNow) {
    canvas.style.cursor = cursorNow;
  }


  
}



let twocodeLastFrameError = -Infinity;
let twocodeLastDraw = -Infinity;

function render(now) {
  try {
    // Resting and the mouse is elsewhere: 30 frames a second is plenty for the small pill
    // and halves the work the PC does all day long.
    if (mode === 'rest' && !pointer.known && now - twocodeLastDraw < 30) return;
    twocodeLastDraw = now;
    drawIslandFrame(now);
  } catch (error) {
    if (now - twocodeLastFrameError >= 1000) {
      twocodeLastFrameError = now;

      console.error(
        '[TwoCode frame]',
        error.stack || error.message || String(error)
      );
    }

    try { ctx.reset?.(); } catch {} // a half-drawn frame can leave ctx.save() states behind
    try {
      resize();
    } catch {}
    // Still decide if the window catches clicks: otherwise one broken frame left the island "click-through"
    // until you hovered or clicked TwoCode again.
    try { sendInteractive(pointer.known && inside(pointer.x, pointer.y, islandBounds)); } catch {}
  } finally {
    requestAnimationFrame(render);
  }
}

requestAnimationFrame(
  render
);


// ============================================================
// LOCAL POINTER
// ============================================================

addEventListener(
  'mousemove',

  event => {
    pointer.x =
      event.clientX;


    pointer.y =
      event.clientY;


    pointer.known =
      true;
  }
);


// ============================================================
// CLICK
// ============================================================

canvas.addEventListener(
  'click',

  async event => {
    const x =
      event.clientX;


    const y =
      event.clientY;


    // ======================================================
    // PROJECT
    // ======================================================

    if (
      inside(
        x,
        y,
        hit.projectChoose
      )
    ) {
      await chooseProject();

      return;
    }


    if (
      inside(
        x,
        y,
        hit.projectSearch
      )
    ) {
      await performProjectSearch();

      return;
    }


    if (
      inside(
        x,
        y,
        hit.projectReadBack
      )
    ) {
      projectReadData =
        null;


      projectSelectedResult =
        null;


      return;
    }


    for (
      let i = 0;
      i <
      3;
      i++
    ) {
      if (
        inside(
          x,
          y,
          hit[
            `projectResult${i}`
          ]
        )
      ) {
        await openProjectResult(
          projectSearchResults[
            i
          ]
        );


        return;
      }
    }


    // ======================================================
    // SMALL ISLAND
    // ======================================================

    if (
      mode !==
        'expanded' &&
      inside(
        x,
        y,
        islandBounds
      )
    ) {
      setMode(
        'expanded'
      );


      return;
    }


    // ======================================================
    // HEADER
    // ======================================================

    if (
      inside(
        x,
        y,
        hit.home
      )
    ) {
      setView(
        'home'
      );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.apps
      )
    ) {
      setView(
        'apps'
      );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.settings
      )
    ) {
      setView(
        'settings'
      );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.sound
      )
    ) {
      soundEnabled =
        !soundEnabled;


      localStorage.setItem(
        'twocode:sound',
        soundEnabled
          ?
            'on'
          :
            'off'
      );


      return;
    }


    // ======================================================
    // APPS
    // ======================================================

    if (
      inside(
        x,
        y,
        hit.projectApp
      )
    ) {
      setView(
        'project'
      );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.spotifyApp
      )
    ) {
      try {
        const state =
          await window.twocode
            .spotifyGetState();


        if (
          !state?.connected
        ) {
          await window.twocode
            .spotifyConnect();
        }


        await refreshSpotify();


        setView(
          'spotify'
        );

      } catch {}


      return;
    }


    if (
      inside(
        x,
        y,
        hit.todayApp
      )
    ) {
      window.twocode
        .openUrl(
          'https://twocode.nl/opvolgen/'
        );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.assistantApp
      )
    ) {
      setView(
        'assistant'
      );


      return;
    }
  }
);


// ============================================================
// ESCAPE
// ============================================================

addEventListener(
  'keydown',

  event => {
    if (
      event.key !==
      'Escape'
    ) {
      return;
    }


    if (
      document.activeElement ===
      projectInput
    ) {
      projectInput.blur();

      return;
    }


    if (
      currentView ===
        'project' &&
      projectReadData
    ) {
      projectReadData =
        null;


      projectSelectedResult =
        null;


      return;
    }


    const leavingProject = currentView === 'project';

    currentView =
      'home';


    projectInput.style.display =
      'none';


    setMode(
      leavingProject ? 'compact' : 'rest'
    );
  }
);


// ============================================================
// SPOTIFY POLL
// ============================================================

setInterval(
  () => {
    if (
      currentView ===
      'spotify'
    ) {
      refreshSpotify();
    }
  },

  2200
);

</script>
